name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI and crates.io
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Verify package and tag versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          python = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert cargo == python, "Cargo and Python versions differ"
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert os.environ["GITHUB_REF_NAME"] == f"v{cargo}", "Tag version differs"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={cargo}\n")
          PY

  wheels:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: '2_28'
          before-script-linux: >-
            dnf install -y alsa-lib-devel systemd-devel libX11-devel
            libXcursor-devel libXi-devel libXrandr-devel libxkbcommon-devel
            wayland-devel mesa-libEGL-devel
      - name: Package standalone binary from wheel
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET"]
          executable = "codestrand.exe" if "windows" in target else "codestrand"
          wheel, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              member, = (name for name in archive.namelist()
                         if name.endswith(f".data/scripts/{executable}"))
              data = archive.read(member)
          Path("binaries").mkdir()
          with zipfile.ZipFile(f"binaries/codestrand-{target}.zip", "w",
                               zipfile.ZIP_DEFLATED) as archive:
              info = zipfile.ZipInfo(executable)
              info.create_system = 3
              info.external_attr = 0o100755 << 16
              archive.writestr(info, data)
              for license_path in ("LICENSE", "LICENSE-APACHE",
                                   "assets/material/LICENSE.txt"):
                  archive.write(license_path, license_path)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/*.zip
          if-no-files-found: error

  sdist:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  draft-github-release:
    needs: [wheels, sdist]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>release-error); then
            test "$draft" = true
          elif grep -Eqi '404|not found' release-error; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --draft --generate-notes
          else
            cat release-error >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" dist/* --clobber

  publish-crates:
    needs: [version-check, draft-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether version exists
        id: pending
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -sS -A codestrand-release-workflow \
            -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/codestrand/$VERSION")
          case "$status" in
            200) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io HTTP status: $status" >&2; exit 1 ;;
          esac
      - name: Install Linux dependencies
        if: steps.pending.outputs.publish == 'true'
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev
          libwayland-dev libegl1-mesa-dev
      - name: Authenticate with crates.io
        if: steps.pending.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: Publish crate
        if: steps.pending.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  publish-pypi:
    needs: [version-check, draft-github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check whether version exists
        id: pending
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/codestrand/$VERSION/json")
          case "$status" in
            200) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected PyPI HTTP status: $status" >&2; exit 1 ;;
          esac
      - name: Publish distributions
        if: steps.pending.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
