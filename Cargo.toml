[package]
name = "annealer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A Git history visualiser with restrained 3D depth and animated diffs"
authors = ["Owen Lamont"]
readme = "README.md"
repository = "https://github.com/owenlamont/annealer"
categories = ["visualization", "development-tools"]
keywords = ["git", "visualization", "history", "animation"]
publish = false

[dependencies]
anyhow = "1"
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_ui_render",
    "default_font",
    "png",
] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
gix = { version = "=0.90.0", default-features = false, features = ["basic", "max-performance", "sha1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.dev]
debug = 0

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
